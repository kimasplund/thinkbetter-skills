name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Script tests
        run: python -m unittest discover -s tests -v
      - name: Skill spec + privacy checks
        run: python scripts/validate_skills.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code plugin validation
        run: |
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate ./skills --strict
